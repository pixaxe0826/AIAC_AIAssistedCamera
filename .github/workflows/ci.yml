name: Standalone code samples

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python group evaluation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python/group-eval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run synthetic evaluation tests
        run: python -m pytest -q

  swift:
    name: Swift latest-frame scheduler
    runs-on: macos-latest
    defaults:
      run:
        working-directory: swift/LatestFrameScheduler
    steps:
      - uses: actions/checkout@v4
      - name: Run synthetic scheduler tests
        run: swift test
